<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wealth & Education Explorer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: sans-serif; }
        .axis-label { font-size: 12px; }
        .tooltip {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            padding: 6px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<h2>Wealth and Education: Country-Level Relationships</h2>

<label for="indicator-select">Education indicator:</label>
<select id="indicator-select">
    <option value="Adult Literacy Rate %">Adult Literacy Rate (%)</option>
    <option value="Primary School Completion Rate %">Primary School Completion Rate (%)</option> //FIX
    <option value="% of GDP Spent On Education">% of GDP Spent On Education</option>
    <option value="Primary School Enrollment %">Primary School Enrollment (%)</option> //FIX
    <option value="Secondary School Enrollment %">Secondary School Enrollment (%)</option> //FIX
    <option value="Tertiary School Enrollment %">Tertiary School Enrollment (%)</option>//FIX
    <option value="Primary Pupil-Teacher Ratio">Primary Pupil-Teacher Ratio</option>
    <option value="Secondary Pupil-Teacher Ratio">Secondary Pupil-Teacher Ratio</option>
</select>

<label for="year-select">Year:</label>
<select id="year-select"></select>


<svg id="chart" width="900" height="550"></svg>
<div id="tooltip" class="tooltip" style="opacity:0;"></div>

<script>
  /////FOR DEBUGGING///////////
    const DEBUG = true
  /////FOR DEBUGGING///////////

    const svg = d3.select("#chart");
    const margin = { top: 40, right: 40, bottom: 60, left: 80 };
    const width = +svg.attr("width") - margin.left - margin.right;
    const height = +svg.attr("height") - margin.top - margin.bottom;

    const g = svg.append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

  //these are the indicators that are formatted as a percentage
  const percentageIndicators = new Set([
    "% of GDP Spent On Education",
    "Adult Literacy Rate %",
    "Primary School Completion Rate %",
    "Primary School Enrollment %",
    "Secondary School Enrollment %",
    "Tertiary School Enrollment %"
  ]);

  const xScale = d3.scaleLinear().range([0, width]);
    const yScale = d3.scaleLinear().range([height, 0]);
    const color = d3.scaleOrdinal(d3.schemeTableau10);

    const xAxisGroup = g.append("g")
        .attr("transform", `translate(0,${height})`);
    const yAxisGroup = g.append("g");

    const xLabel = g.append("text")
        .attr("class", "axis-label")
        .attr("x", width / 2)
        .attr("y", height + 40)
        .attr("text-anchor", "middle")
        .text("Wealth Index (0–100)");

    const yLabel = g.append("text")
        .attr("class", "axis-label")
        .attr("transform", "rotate(-90)")
        .attr("x", -height / 2)
        .attr("y", -55)
        .attr("text-anchor", "middle");

    const tooltip = d3.select("#tooltip");

  const indicatorSelect = d3.select("#indicator-select");
  const yearSelect = d3.select("#year-select");

  let data;

    d3.csv("combined_dataset.csv").then(raw => {


      // Coerce numeric columns
        raw.forEach(d => {
            d.Year = +d.Year;
            d["Wealth Index"] = +d["Wealth Index"];
            d["GINI Index"] = d["GINI Index"] ? +d["GINI Index"] : null;

            d["% of GDP Spent On Education"] = +d["% of GDP Spent On Education"];
            d["Adult Literacy Rate (%)"] = +d["Adult Literacy Rate (%)"];
            d["Primary School Completion Rate (%)"] = +d["Primary School Completion Rate (%)"];
            d["Primary School Enrollment (%)"] = +d["Primary School Enrollment (%)"];
            d["Secondary School Enrollment (%)"] = +d["Secondary School Enrollment (%)"];
            d["Tertiary School Enrollment (%)"] = +d["Tertiary School Enrollment (%)"];
            d["Primary Pupil-Teacher Ratio"] = +d["Primary Pupil-Teacher Ratio"];
            d["Secondary Pupil-Teacher Ratio"] = +d["Secondary Pupil-Teacher Ratio"];

        });

        data = raw;

        raw.forEach(d => {
          d.Year = +d["Year"];   // force numeric conversion
        });

      // Populate year dropdown
        const years = Array.from(new Set(data.map(d => d.Year))).sort((a, b) => a - b);
        yearSelect
            .selectAll("option")
            .data(years)
            .enter()
            .append("option")
            .attr("value", d => d)
            .text(d => d);

        yearSelect.property("value", years[years.length - 1]); // latest year

        //Color by continent/region if available, else default
        //const regions = Array.from(new Set(data.map(d => d.Continent || d.Region || "Other")));
        //color.domain(regions);

        indicatorSelect.on("change", update);
        yearSelect.on("change", update);

        update();
    });

    function update() {
      const indicator = indicatorSelect.property("value");   // CSV column name
      const indicatorLabel = indicatorSelect
        .select("option:checked")
        .text();                                           // pretty label

      const year = +yearSelect.property("value");

      //if a value does not exist under the selected indicator, remove the dot
      const filtered = data.filter(d =>{
        const wealth = +d["Wealth Index"];
        const indicatorValue = +d[indicator];

        return (
          d.Year === year &&
          !isNaN(wealth) &&
          wealth !== 0 &&
          d[indicator] !== "" &&
          d[indicator] !== 0 &&
          d[indicator] !== null &&
          d[indicator] !== undefined &&
          String(d[indicator]).trim() !== "" &&
          !isNaN(indicatorValue)
        );

      });


      if (!filtered.length) return;
        if (DEBUG) console.log("Filtered rows:", filtered.length);
        xScale.domain(d3.extent(filtered, d => d["Wealth Index"])).nice();
        yScale.domain([
          d3.min(filtered, d => +d[indicator]),
          d3.max(filtered, d => +d[indicator])
        ]).nice(); //nice() makes the scale boundaries "nice" round numbers

      const isPercent = percentageIndicators.has(indicator);

      xAxisGroup.call(d3.axisBottom(xScale));
      yAxisGroup.call(
        d3.axisLeft(yScale)
          .tickFormat(d => isPercent ? d.toFixed(2) *100 + "%" : d.toFixed(0))
      );


      //EACH CIRCLE REPRESENTS A COUNTRY
        const circles = g.selectAll("circle")
            .data(filtered, d => d["Country"] + d.Year);

        circles.exit().remove();

        circles.enter()
            .append("circle")
            .attr("r", 4)
            .attr("cx", d => xScale(d["Wealth Index"]))
            .attr("cy", d => yScale(d[indicator]))
            .attr("fill", d =>  color(d["Country"]))
            .on("mouseover", (event, d) => {
              const indicator = indicatorSelect.property("value");
              const indicatorLabel = indicatorSelect.select("option:checked").text();

              const country = d["Country"];   // <-- use your real column name
              const wealth = +d["Wealth Index"];
              const indicatorValue = +d[indicator];
              const isPercent = percentageIndicators.has(indicator);
              const formattedValue = isFinite(indicatorValue)
                ? (isPercent ? (indicatorValue).toFixed(2)*100 + "%" : indicatorValue.toFixed(2))
                : "N/A";


              tooltip
                    .style("opacity", 1)
                    .html(`<strong>${country}</strong><br/>
                            Year: ${d.Year}<br/>
                            Wealth Index: ${isFinite(wealth) ? wealth.toFixed(2) : "N/A"}<br/>
                            ${indicatorLabel}: ${formattedValue}
                        `) ////// FORMATS VALUE AS % FOR ALL COLUMNS EXCEPT RATIO COLUMNS

                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 28) + "px");

            })
            .on("mousemove", (event) => {
                tooltip
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 28) + "px");
            })
            .on("mouseout", () => {
                tooltip.style("opacity", 0);
            })
            .merge(circles)
            .transition()
            .duration(600)
            .attr("cx", d => xScale(d["Wealth Index"]))
            .attr("cy", d => yScale(d[indicator]));
    }
</script>
</body>
</html>
